<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="明信片柜" />
    <title>明信片柜</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="phone" aria-label="明信片柜 App">
        <header class="app-header">
          <div>
            <p class="eyebrow">Postbox</p>
            <h1 id="page-title">明信片柜</h1>
          </div>
          <button class="decor-toggle" id="decor-toggle" type="button" aria-expanded="false">装饰</button>
        </header>

        <section class="page is-active" id="page-cabinet" aria-labelledby="page-title">
          <div class="cabinet-count" aria-label="收藏摘要">
            <strong id="total-count">0</strong>
            <span>张明信片在柜子里</span>
          </div>

          <div class="filter-shell">
            <button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="false">筛选</button>
            <div class="filter-bar" id="filter-bar" aria-label="检索明信片" aria-hidden="true">
              <span class="filter-title">时间</span>
              <div class="time-filter-list" id="time-filter-list" aria-label="时间排序">
                <button class="filter-chip is-active" type="button" data-sort="newest">新到旧</button>
                <button class="filter-chip" type="button" data-sort="oldest">旧到新</button>
              </div>
              <button class="clear-filter-button" id="clear-filters" type="button">清空</button>
              <span class="filter-title">词条</span>
              <div class="tag-filter-list" id="tag-filter-list" aria-label="词条筛选"></div>
            </div>
          </div>

          <div class="cabinet-frame" aria-label="明信片展示架">
            <div class="decor-layer" aria-hidden="true">
              <div class="decor-frame" id="decor-frame" hidden>
                <img id="decor-frame-image" alt="" />
              </div>
              <div class="decor-stamp" id="decor-stamp" hidden></div>
              <div class="decor-label" id="decor-label" hidden>Postbox</div>
              <img class="decor-vase" id="decor-vase" alt="" hidden />
            </div>
            <div class="cabinet-sketch" aria-hidden="true"></div>
            <div class="cabinet" id="cabinet-list" aria-label="明信片架子"></div>
          </div>

          <div class="shelf-pager" id="shelf-pager" aria-hidden="true">
            <button id="page-prev" type="button">上一页</button>
            <span id="page-status">1 / 1</span>
            <button id="page-next" type="button">下一页</button>
          </div>

          <section class="decor-panel" id="decor-panel" aria-hidden="true" aria-label="装饰柜子">
            <div class="decor-section">
              <span>柜子</span>
              <div class="decor-options" aria-label="柜子颜色">
                <button type="button" data-cabinet-theme="warm">胡桃</button>
                <button type="button" data-cabinet-theme="cream">奶油</button>
                <button type="button" data-cabinet-theme="sage">绿柜</button>
                <button type="button" data-cabinet-theme="rosewood">红木</button>
              </div>
            </div>
            <div class="decor-section">
              <span>线条</span>
              <div class="decor-options" aria-label="线条颜色">
                <button type="button" data-line-theme="sepia">茶色</button>
                <button type="button" data-line-theme="ink">墨色</button>
                <button type="button" data-line-theme="pencil">铅笔</button>
                <button type="button" data-line-theme="red">红棕</button>
              </div>
            </div>
            <div class="decor-section">
              <span>背景</span>
              <div class="decor-options" aria-label="背景">
                <button type="button" data-bg-theme="paper">纸</button>
                <button type="button" data-bg-theme="room">墙纸</button>
                <button type="button" data-bg-theme="desk">桌面</button>
              </div>
            </div>
            <div class="decor-section">
              <span>摆件</span>
              <div class="decor-options" aria-label="摆件">
                <button type="button" data-ornament="frame">相框</button>
                <button type="button" data-ornament="stamp">邮票</button>
                <button type="button" data-ornament="label">标签</button>
                <button type="button" data-vase-shape="shape1">花瓶一</button>
                <button type="button" data-vase-shape="shape2">花瓶二</button>
                <button type="button" data-vase-shape="shape3">花瓶三</button>
              </div>
              <label class="frame-upload">
                <input id="frame-image-input" type="file" accept="image/*" />
                <span>换相框照片</span>
              </label>
            </div>
          </section>
        </section>

        <section class="page" id="page-scan" aria-label="扫描入柜">
          <form class="scan-form" id="postcard-form">
            <div class="scan-grid">
              <label class="scan-drop">
                <input id="front-input" name="front" type="file" accept="image/*" capture="environment" />
                <span class="drop-title">正面</span>
                <span class="drop-hint">拍图像</span>
                <img id="front-preview" alt="" />
              </label>

              <label class="scan-drop">
                <input id="back-input" name="back" type="file" accept="image/*" capture="environment" />
                <span class="drop-title">背面</span>
                <span class="drop-hint">拍邮戳</span>
                <img id="back-preview" alt="" />
              </label>
            </div>

            <div class="scan-fields">
              <label class="date-field">
                <span>时间</span>
                <input id="date-input" name="date" type="date" />
              </label>

              <div class="tag-field">
                <span>词条</span>
                <div class="tag-composer">
                  <input id="tag-input" type="text" placeholder="创建或输入词条" list="tag-options" />
                  <button class="secondary-button compact-button" id="add-tag" type="button">加入</button>
                </div>
                <datalist id="tag-options"></datalist>
                <div class="tag-list" id="selected-tags" aria-label="已选择词条"></div>
              </div>

              <label class="note-field">
                <span>备注</span>
                <textarea id="note-input" name="note" rows="3"></textarea>
              </label>
            </div>

            <div class="form-actions">
              <button class="secondary-button" id="cancel-scan" type="button">返回</button>
              <button class="primary-button" type="submit">收进柜子</button>
            </div>
          </form>
        </section>

        <section class="cropper" id="scan-cropper" aria-hidden="true" aria-label="扫描裁切">
          <div class="cropper-topbar">
            <button class="viewer-button" id="crop-cancel" type="button">取消</button>
            <span id="crop-title">调整边缘</span>
            <button class="viewer-button" id="crop-apply" type="button">确认</button>
          </div>

          <div class="crop-stage" id="crop-stage">
            <img id="crop-image" alt="" />
            <svg class="crop-overlay" id="crop-overlay" aria-hidden="true">
              <polygon id="crop-polygon"></polygon>
              <circle data-corner="0" r="9"></circle>
              <circle data-corner="1" r="9"></circle>
              <circle data-corner="2" r="9"></circle>
              <circle data-corner="3" r="9"></circle>
            </svg>
          </div>
        </section>

        <button class="floating-add" id="quick-scan" type="button" aria-label="扫描明信片">
          <span aria-hidden="true">+</span>
        </button>

        <section class="viewer" id="postcard-viewer" aria-hidden="true" aria-label="明信片查看器">
          <div class="viewer-topbar">
            <button class="viewer-button" id="viewer-close" type="button">返回</button>
            <span id="viewer-title">明信片</span>
            <div class="viewer-actions">
              <button class="viewer-button danger-button" id="viewer-delete" type="button">删除</button>
              <button class="viewer-button" id="viewer-flip" type="button">翻面</button>
            </div>
          </div>

          <button class="viewer-stage" id="viewer-stage" type="button" aria-label="点击翻转明信片">
            <span class="viewer-card" id="viewer-card"></span>
          </button>

          <p class="viewer-note" id="viewer-note" hidden></p>

          <label class="zoom-control">
            <span>缩放</span>
            <input id="viewer-zoom" type="range" min="1" max="3.2" value="1" step="0.05" />
          </label>
        </section>
      </main>
    </div>

    <template id="shelf-template">
      <section class="shelf-row">
        <div class="shelf-track"></div>
      </section>
    </template>

    <script src="./src/app.js" type="module"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
